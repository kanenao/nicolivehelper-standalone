name: Build NicoLive Recorder

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "nicolive-recorder/**"
      - ".github/workflows/nicolive-recorder-build.yml"
  pull_request:
    paths:
      - "nicolive-recorder/**"
      - ".github/workflows/nicolive-recorder-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: nicolive-recorder
        run: npm install --no-audit --no-fund

      - name: Build installer and portable ZIP
        working-directory: nicolive-recorder
        run: npm run dist:win

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NicoLive-Recorder-beta1-Windows
          path: nicolive-recorder/dist/*
          if-no-files-found: error
          retention-days: 14
