name: Build & Release

on:
  push:
    branches:
      - 'feature/auto-enquete-skip'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Create as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nicolivehelper-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Developer Mode (Allow Symlinks for electron-builder)
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Regenerate dependency lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        if: github.ref == 'refs/heads/feature/auto-enquete-skip'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync package-lock for app dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate JavaScript syntax
        working-directory: app
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          node --check src/main/main.js
          node --check src/options/options.js

      - name: Determine Release Version
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            VERSION=$(node -p "require('./app/package.json').version")
            TAG="v${VERSION}"
          fi
          RAW_VERSION="${TAG#v}"
          RAW_VERSION="${RAW_VERSION#V}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "Release Tag: ${TAG}"
          echo "Release Version: ${RAW_VERSION}"

      - name: Sync package.json version
        working-directory: app
        run: npm version ${{ steps.release_info.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Windows Packages (NSIS Installer & Portable ZIP)
        working-directory: app
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: nicolivehelper-standalone-windows
          path: |
            app/dist/*.exe
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/*.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/auto-enquete-skip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.tag }}
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || contains(steps.release_info.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            app/dist/*.exe
            app/dist/*.zip
            app/dist/*.blockmap
            app/dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
